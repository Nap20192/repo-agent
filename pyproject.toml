[project]
name = "scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.9.0",
    "litellm>=1.100.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = ["live: exercises real models/servers (LIVE_EVAL=1)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# defaults (E4, E7, E9, F) + bugbear, blind-except (every `except Exception` names its reason), pyupgrade,
# isort, simplify, return — the rule set the `# noqa` comments in the code refer to.
extend-select = ["B", "BLE", "UP", "I", "SIM", "RET"]
